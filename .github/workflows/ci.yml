name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: the gate proves itself
        run: npm test

      # ⚑ AND THE GATE IS NOW GATED ITSELF. This repo's whole claim is "no listing without a
      # reproducible, un-forgeable pass". It sat at works — ten tests, green, no mutation gate —
      # while 21 of 34 mutants survived. A gate with no gate of its own is the lemon it exists to
      # catch. Pinned: an unpinned gate is a gate somebody else can change.
      - name: witness — try to break the gate's own tests
        run: |
          git clone --depth 1 --branch v0.3 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate filter.mjs \
            --cap 400 --baseline witness.filter.baseline.json --test npm test | tee gate.out

      # ⚑ witness EXITS 0 EVEN WHEN MUTANTS SURVIVE. Without this the step above is decoration.
      - name: refuse anything short of clean
        run: |
          node -e "
            const out = require('fs').readFileSync('gate.out','utf8');
            const all = [...out.matchAll(/\"clean\":\s*(true|false)/g)].map(m => m[1]);
            if (all.length !== 1) { console.error('expected 1 gate verdict, saw ' + all.length); process.exit(1); }
            if (all[0] !== 'true') { console.error('mutants survived — those lines are test-theatre'); process.exit(1); }
            console.log('gate clean');
          "

      # ⚑ The page inlines this repo's kernel so a visitor exercises the code the gate proved. Nothing
      # verified that, and build-page.mjs pointed at an absolute path on one machine — so it could not
      # have been run here at all. A page that quietly stopped being the kernel is invisible until
      # somebody reads it.
      - name: the live page is still the gated kernel
        run: node build-page.mjs --check
